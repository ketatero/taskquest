  <style>

    .task-group,.reminder-group{display:grid;gap:0}.task-trailing{display:flex;align-items:center;gap:8px}.reminder-trailing{display:grid;justify-items:end;align-items:center;gap:6px}.expand-subtasks{min-width:38px;min-height:36px;border:1px solid #e1e6e2;border-radius:10px;background:#fff;color:#59636d;font-size:12px;font-weight:700;padding:0 8px}.expand-subtasks:hover{background:#f1f5f1}.subtask-progress{display:flex;align-items:center;gap:8px;margin-top:7px;color:#6a7b70;font-size:11px}.subtask-progress .progress{width:74px;height:6px}.subtask-progress .progress span{background:#6b9478}.subtask-list{display:grid;gap:4px;margin:0 0 4px 39px;padding:7px 8px 8px 12px;border-left:2px solid #dce6de;background:#f5f8f5;border-radius:0 0 12px 12px;max-height:1000px;overflow:hidden;transition:max-height .18s ease,opacity .18s ease,padding .18s ease;animation:subtask-reveal .18s ease-out}.subtask-list.closing{max-height:0;opacity:0;padding-top:0;padding-bottom:0;animation:subtask-close .18s ease-in both}.subtask-row{display:grid;grid-template-columns:24px minmax(0,1fr);gap:9px;align-items:center;padding:7px 4px}.subtask-row .check{width:21px;height:21px;border-radius:7px}.subtask-title{font-size:13px;line-height:1.4;overflow-wrap:anywhere}.subtask-title.done{text-decoration:line-through;color:#89928b}.subtask-editor{display:grid;gap:9px;padding:14px;border:1px solid #e6ebe6;border-radius:14px;background:#f8faf8}.subtask-editor h3{margin:0;font-size:14px}.subtask-edit-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center}.subtask-edit-row input{min-width:0;padding:10px 11px;border:1px solid #dfe3df;border-radius:9px;background:#fff}.subtask-edit-row .text-btn{min-height:40px}.subtask-add{justify-self:start;min-height:42px}.subtask-editor-note{font-size:11px;color:var(--muted);line-height:1.5}@keyframes subtask-reveal{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}@keyframes subtask-close{from{max-height:1000px;opacity:1}to{max-height:0;opacity:0}}@media(prefers-reduced-motion:reduce){.subtask-list{animation:none;transition:none}}
    .calendar-legend{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 12px;font-size:12px;color:#59636d}.calendar-legend span{display:inline-flex;align-items:center;gap:5px}.legend-mission,.calendar-symbol.mission{color:#426287}.legend-quest,.calendar-symbol.quest{color:#b55353}

    .mission-list{display:grid;gap:8px}.mission-row{display:grid;grid-template-columns:minmax(75px,auto) 1fr auto;gap:10px;align-items:center;padding:12px 10px;border-radius:14px;background:#eef4fa;border:1px solid #dce6f1}.mission-time{font-size:13px;font-weight:750;color:#426287;white-space:nowrap}.mission-label{font-size:10px;font-weight:750;color:#426287}.mission-title{font-weight:650;font-size:14px}.mission-actions{display:flex;gap:4px;justify-content:flex-end}.kind-select{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kind-select label{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid #dfe3df;border-radius:12px;background:#fff;font-size:14px}.kind-select input{accent-color:#385f8f}.time-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}

<body>
  <div id="root"></div>
  <script>
    const STORE='yorimichi.tasks.v1';
    const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const seed=[
      {id:'demo-1',title:'提出レポートの見直し',due:offsetISO(1),category:'課題',done:false,demo:true},
      {id:'demo-2',title:'シフト希望を送る',due:offsetISO(3),category:'仕事',done:false,demo:true},
      {id:'demo-3',title:'書類をファイルに入れる',due:offsetISO(-1),category:'ファイナンス',done:true,demo:true},
    ];
    function offsetISO(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function dateObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
    function formatDate(s,opts={month:'numeric',day:'numeric'}){if(!s)return '日付なし';return dateObj(s).toLocaleDateString('ja-JP',opts)}
    function startWeek(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
    function isMission(t){return t.type==='mission'}
    function entryDate(t){return isMission(t)?t.date:t.due}
    function entryTime(t){return isMission(t)?t.startTime:t.dueTime}
    function timeRange(t){if(!isMission(t))return t.dueTime?`${t.dueTime}締切`:'';if(t.startTime&&t.endTime)return `${t.startTime}〜${t.endTime}`;if(t.startTime)return `${t.startTime}から`;return '終日'}
    function calendarItems(date){return state.tasks.filter(t=>entryDate(t)===date).sort((a,b)=>(entryTime(a)||'').localeCompare(entryTime(b)||''))}
    function periodTasks(tasks,period){const now=dateObj(todayISO());let start,end;if(period==='day'){start=new Date(now);end=new Date(now)}else if(period==='week'){start=startWeek(now);end=new Date(start);end.setDate(end.getDate()+6)}else{start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0)}return tasks.filter(t=>!isMission(t)&&t.due&&dateObj(t.due)>=start&&dateObj(t.due)<=end)}
    function pct(tasks){return tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):null}
    function daysLeft(s){return Math.round((dateObj(s)-dateObj(todayISO()))/86400000)}
    function dueText(s,done,time){if(done)return '完了';const n=daysLeft(s);if(n<0)return `期限超過 ${Math.abs(n)}日`;if(n===0&&time){const now=new Date(),current=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;return time<current?`期限超過（${time}）`:`今日 ${time}まで`}if(n===0)return '今日が締切';if(n===1)return 'あと1日';return `あと${n}日`}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let storageMessage='';
    function loadTasks(){try{const raw=localStorage.getItem(STORE);if(!raw)return seed;const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw new Error('invalid task data');let repaired=false;for(const task of parsed){if(!Array.isArray(task?.subtasks))continue;const used=new Set();task.subtasks=task.subtasks.map(child=>{const item=child&&typeof child==='object'?child:{title:String(child??''),done:false};let id=typeof item.id==='string'&&item.id?item.id:'';if(!id||used.has(id)){do{id=`sub-${Date.now()}-${Math.random().toString(16).slice(2)}`}while(used.has(id));repaired=true}used.add(id);return id===item.id?item:{...item,id}})}if(repaired){try{localStorage.setItem(STORE,JSON.stringify(parsed))}catch{}}return parsed}catch{storageMessage='保存データを読み込めませんでした。このブラウザーでファイルの保存が制限されている可能性があります。';return seed}}
    const initialTasks=loadTasks();
    const CATEGORY_STORE='yorimichi.categories.v1';
    const DEFAULT_CATEGORIES=['課題','仕事','ファイナンス','健康'];
    const LEGACY_DEFAULT_CATEGORIES=['生活','学校','仕事','健康','その他'];
    function loadCategories(tasks){try{const saved=JSON.parse(localStorage.getItem(CATEGORY_STORE)||'null');const wasLegacyDefaults=Array.isArray(saved)&&saved.length===LEGACY_DEFAULT_CATEGORIES.length&&saved.every((c,i)=>c===LEGACY_DEFAULT_CATEGORIES[i]);const list=wasLegacyDefaults?[...DEFAULT_CATEGORIES]:Array.isArray(saved)?saved.filter(x=>typeof x==='string'&&x.trim()):[...DEFAULT_CATEGORIES];if(wasLegacyDefaults)for(const t of tasks)if(t.demo){if(t.category==='学校')t.category='課題';else if(t.category==='生活')t.category='健康'}for(const t of tasks)if(t.category&&!list.includes(t.category))list.push(t.category);return [...new Set(list)]}catch{return [...DEFAULT_CATEGORIES]}}

      let content='';
      if(state.tab==='home'){const weekly=periodTasks(state.tasks,'week');content=`<div class="layout"><div class="stack">${dailyQuest(todayTasks)}${upcomingMissions.length?missionCard(upcomingMissions):''}${weeklyQuest(weekly)}</div><div class="stack"><section class="card"><div class="card-head"><h2>達成率</h2><span class="muted small">クエストの締切日で集計</span></div><div class="stack">${progress(periodTasks(state.tasks,'day'),'今日')}${progress(weekly,'今週')}</div></section></div></div>`}
      if(state.tab==='calendar'){content=`<section class="card"><div class="card-head"><div class="month-nav"><button data-action="month-prev" aria-label="前の月">‹</button><strong>${state.month.getFullYear()}年${state.month.getMonth()+1}月</strong><button data-action="month-next" aria-label="次の月">›</button></div><div class="view-toggle">${[['month','月'],['week','週'],['day','日']].map(([v,l])=>`<button data-action="range" data-range="${v}" class="${state.range===v?'active':''}">${l}</button>`).join('')}</div></div>${state.range==='month'?monthCalendar():state.range==='week'?weekCalendar():dayCalendar()}<div class="muted small" style="margin-top:14px">ミッションは青色、クエストの締切は赤色で表示します。</div></section>`}
      if(state.tab==='reminders'){const filtered=ordered.filter(t=>!isMission(t)&&(state.filter==='all'?true:state.filter==='open'?!t.done:state.filter==='done'?t.done:!t.done&&daysLeft(t.due)<0));content=`<section class="card"><div class="card-head"><h2>タスク一覧</h2><div class="list-tools"><select class="select" id="filter" aria-label="表示するタスク"><option value="all" ${state.filter==='all'?'selected':''}>すべて</option><option value="open" ${state.filter==='open'?'selected':''}>未完了</option><option value="done" ${state.filter==='done'?'selected':''}>完了</option><option value="late" ${state.filter==='late'?'selected':''}>期限超過</option></select></div></div>${reminders(filtered)}</section>`}
      if(state.tab==='about')content=siteInfo();
      root.innerHTML=`<div class="app"><aside><div class="brand"><div class="brand-mark">◒</div><div><strong>タスククエスト</strong><small>TASQUEST</small></div></div><nav class="nav" aria-label="メインメニュー"><button data-action="tab" data-tab="home" class="${state.tab==='home'?'active':''}"><span class="ico">⌂</span>ホーム</button><button data-action="tab" data-tab="calendar" class="${state.tab==='calendar'?'active':''}"><span class="ico">▦</span>カレンダー</button><button data-action="tab" data-tab="reminders" class="${state.tab==='reminders'?'active':''}"><span class="ico">☑</span>タスク一覧</button><button data-action="tab" data-tab="about" class="${state.tab==='about'?'active':''}"><span class="ico">ℹ</span>サイト情報</button></nav><div class="aside-note"><strong>小さく始めてOK</strong>予定が多い日も、ひとつできたら前進です。</div></aside><main><div class="topline"><div><div class="date-label">${new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div><h1>${label[0]}</h1><div class="muted small">${label[1]}</div></div><button class="primary" data-action="new">＋ タスクを追加</button></div>${storageMessage?`<div class="storage-alert" role="alert">⚠ ${esc(storageMessage)}</div>`:''}${state.flash?`<div class="success-alert" role="status">✓ ${esc(state.flash)}</div>`:''}${content}${state.showForm?(state.showCategoryManager?categoryManager():form()):''}<div class="muted small" style="text-align:center;margin-top:22px">データはこのブラウザー内に保存されます。別の端末とは同期されません。最初の3件はサンプルです。</div></main></div>`;
    }
    root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(!['manage-categories','close-category-manager','add-category','rename-category','delete-category'].includes(a))return;e.stopImmediatePropagation();if(a==='manage-categories'){const f=root.querySelector('#task-form');if(f)state.taskDraft=captureTaskDraft(f);state.categoryMessage='';state.showCategoryManager=true;render();return}if(a==='close-category-manager'){state.showCategoryManager=false;state.categoryMessage='';render();return}if(a==='add-category'){const input=root.querySelector('#new-category'),name=String(input?.value||'').trim();if(!name)state.categoryMessage='カテゴリー名を入力してください。';else if(state.categories.includes(name))state.categoryMessage='同じ名前のカテゴリーがあります。';else{state.categories.push(name);saveCategories();state.categoryMessage='カテゴリーを追加しました。'}render();return}const i=Number(b.dataset.index),old=state.categories[i];if(a==='rename-category'){const input=root.querySelector('#category-name-'+i),name=String(input?.value||'').trim();if(!name)state.categoryMessage='カテゴリー名を入力してください。';else if(state.categories.some((c,j)=>j!==i&&c===name))state.categoryMessage='同じ名前のカテゴリーがあります。';else{state.categories[i]=name;state.tasks=state.tasks.map(t=>t.category===old?{...t,category:name}:t);if(state.taskDraft?.category===old)state.taskDraft.category=name;saveCategories();save();state.categoryMessage='カテゴリー名を変更しました。'}render();return}if(old&&state.categories.length>1){const remaining=state.categories.filter((_,j)=>j!==i),fallback=remaining[0];state.categories=remaining;state.tasks=state.tasks.map(t=>t.category===old?{...t,category:fallback}:t);if(state.taskDraft?.category===old)state.taskDraft.category=fallback;saveCategories();save();state.categoryMessage='削除したカテゴリーのタスクを、残っているカテゴリーへ移動しました。'}render()});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='backdrop'&&e.target!==b)return;if(a==='save-task'){saveTask();return}if(a!=='tab')state.flash='';if(a==='tab')state.tab=b.dataset.tab;if(a==='new'){state.editing=null;state.taskDraft=null;state.showCategoryManager=false;state.showForm=true}if(a==='close-form'||(a==='backdrop'&&e.target===b)){state.showForm=false;state.showCategoryManager=false;state.taskDraft=null};if(a==='toggle-daily'){state.showAllDaily=!state.showAllDaily;render();return}if(a==='toggle-weekly'){state.showWeeklyTasks=!state.showWeeklyTasks;render();return}if(a==='toggle-subtasks'){if(state.collapsingTasks.has(id)){state.collapsingTasks.delete(id);render();return}if(state.expandedTasks.has(id)){state.collapsingTasks.add(id);render();setTimeout(()=>{state.expandedTasks.delete(id);state.collapsingTasks.delete(id);render()},180);return}state.expandedTasks.add(id);render();return}if(a==='toggle-subtask'){const parentId=b.dataset.parentId,subtaskId=b.dataset.subtaskId;state.tasks=state.tasks.map(t=>{if(t.id!==parentId)return t;const subtasks=(Array.isArray(t.subtasks)?t.subtasks:[]).map(s=>s.id===subtaskId?{...s,done:!s.done}:s);return {...t,subtasks,done:subtasks.length?subtasks.every(s=>s.done):t.done}});save();render();return}if(a==='subtask-add'){const f=root.querySelector('#task-form');if(f)state.taskDraft=captureTaskDraft(f);state.taskDraft=state.taskDraft||{};state.taskDraft.subtasks=[...(state.taskDraft.subtasks||[]),{id:`sub-${Date.now()}-${Math.random().toString(16).slice(2)}`,title:'',done:false}];render();return}if(a==='subtask-remove'){const f=root.querySelector('#task-form');if(f)state.taskDraft=captureTaskDraft(f);state.taskDraft=state.taskDraft||{};state.taskDraft.subtasks=(state.taskDraft.subtasks||[]).filter(s=>s.id!==b.dataset.removeSubtaskId);render();return}if(a==='toggle'){state.tasks=state.tasks.map(t=>{if(t.id!==id)return t;const done=!t.done;return {...t,done,subtasks:Array.isArray(t.subtasks)?t.subtasks.map(s=>({...s,done})):t.subtasks}});save()}if(a==='edit'){state.editing=state.tasks.find(t=>t.id===id);state.taskDraft=null;state.showCategoryManager=false;state.showForm=true}if(a==='delete'){if(confirm('このタスクを削除しますか？')){state.tasks=state.tasks.filter(t=>t.id!==id);save()}}if(a==='range')state.range=b.dataset.range;if(a==='month-prev')state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);if(a==='month-next')state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);if(a==='day-prev'){const d=dateObj(state.day);d.setDate(d.getDate()-1);state.day=toISO(d)}if(a==='day-next'){const d=dateObj(state.day);d.setDate(d.getDate()+1);state.day=toISO(d)}render()});
    root.addEventListener('change',e=>{if(e.target.id==='filter'){state.filter=e.target.value;render()}if(e.target.id==='entry-type'){const f=root.querySelector('#task-form');if(f)state.taskDraft=captureTaskDraft(f);render()}});
    root.addEventListener('submit',e=>{if(e.target.id==='task-form')saveTask(e)});
    function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    render();
  </script>
</body>
</html>
