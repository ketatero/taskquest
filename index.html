<html lang="ja">
<head>

  <style>
    :root{--ink:#242b35;--muted:#77808c;--paper:#f6f5f1;--white:#fff;--line:#e8e8e2;--blue:#385f8f;--blue-soft:#e9f0f8;--mint:#e5f2ec;--green:#36785c;--amber:#b87830;--red:#b55353;--shadow:0 12px 36px rgba(39,53,67,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer} .app{min-height:100vh;display:grid;grid-template-columns:248px 1fr;max-width:1440px;margin:auto}
    aside{padding:32px 20px;background:#f0f0e9;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:30px}.brand{display:flex;gap:12px;align-items:center;padding:0 8px}.brand-mark{width:42px;height:42px;border-radius:15px;background:#dce9df;color:#39745b;display:grid;place-items:center;font-size:22px}.brand strong{font-size:18px;letter-spacing:.03em}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;text-align:left;padding:13px 14px;border-radius:14px;color:#626c77;font-weight:650;display:flex;gap:12px;align-items:center}.nav button.active{background:#fff;color:var(--blue);box-shadow:0 3px 12px #2633440b}.nav .ico{width:22px;text-align:center;font-size:17px}.nav button.nav-add{color:var(--blue);font-weight:800}.aside-note{margin-top:auto;background:#e6eee8;border-radius:18px;padding:16px;color:#526c5c;font-size:13px;line-height:1.65}.aside-note strong{display:block;color:#345b45;margin-bottom:4px}
    main{padding:34px clamp(20px,5vw,68px) 60px;max-width:1150px;width:100%;margin:0 auto}.topline{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}.date-label{font-size:13px;color:var(--muted);letter-spacing:.04em}.topline h1{font-size:30px;margin:5px 0 0;letter-spacing:-.04em}.primary{border:0;border-radius:13px;background:var(--blue);color:white;padding:12px 18px;font-weight:700;box-shadow:0 5px 12px #385f8f24}.primary:hover{background:#2e517d}.primary.add-task-button{min-height:54px;padding:15px 23px;border-radius:16px;background:#315c49;font-size:16px;letter-spacing:.01em;box-shadow:0 7px 16px #315c4933}.primary.add-task-button:hover{background:#274b3a;transform:translateY(-1px)}.primary.add-task-button:focus-visible,.nav button.nav-add:focus-visible{outline:3px solid #d58a43;outline-offset:3px}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(260px,.9fr);gap:20px;align-items:start}.stack{display:grid;gap:18px}.card{background:var(--white);border:1px solid #eeeee9;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.card h2{font-size:17px;margin:0}.muted{color:var(--muted)}.small{font-size:13px}.daily-card{background:#e9f0e9;border-color:#dce9df}.daily-card h2{font-size:20px}.weekly-card{background:#fff;border-color:#eeeee9}.daily-card,.weekly-card{width:100%;max-width:560px;justify-self:start}.hero{background:#e9f0e9;border-color:#e1ebe2;padding:24px}.hero .eyebrow{font-size:13px;color:#587263}.hero h2{font-size:22px;margin:7px 0 6px}.hero p{margin:0;color:#61736a;font-size:14px}.progress-wrap{margin-top:20px}.progress-copy{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}.progress-copy strong{font-size:22px;color:#315c49}.progress{height:11px;background:#d5e2d8;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:#4c8b69;border-radius:99px;transition:width .2s ease}.progress-note{font-size:12px;color:#6a7b70;margin-top:8px}.task-list{display:grid;gap:8px}.task-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:12px 10px;border-radius:14px;background:#fafaf8}.task-row:hover{background:#f4f6f2}.check{border:1.5px solid #b9c5be;background:white;border-radius:8px;width:24px;height:24px;color:white;display:grid;place-items:center;padding:0}.check.done{background:#4c8b69;border-color:#4c8b69}.task-title{font-weight:650;font-size:14px}.task-title.done{text-decoration:line-through;color:#89928b}.task-title.late{color:var(--red)}.task-meta{font-size:12px;color:var(--muted);margin-top:4px}.task-note{font-size:12px;color:#65716c;margin-top:5px;white-space:pre-wrap;overflow-wrap:anywhere}.due{font-weight:700;font-size:12px;color:var(--blue);white-space:nowrap}.due.soon{color:var(--amber)}.due.late{color:var(--red)}.pill{font-size:11px;padding:5px 9px;border-radius:99px;background:var(--blue-soft);color:var(--blue);white-space:nowrap}.empty{padding:24px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.7}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:15px 14px;border-radius:15px;background:#fafaf8}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:20px;margin-top:6px}.stat small{font-size:11px;color:var(--muted)}.view-toggle{display:flex;background:#f3f4f2;padding:4px;border-radius:11px;gap:2px}.view-toggle button,.month-nav button{border:0;border-radius:8px;background:transparent;padding:7px 10px;color:#66717d;font-size:12px}.view-toggle button.active{background:white;color:var(--blue);box-shadow:0 1px 4px #0000000d}.month-nav{display:flex;align-items:center;gap:8px}.month-nav button{font-size:17px;padding:3px 9px}.month-nav strong{min-width:104px;text-align:center}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.weekday{text-align:center;color:var(--muted);font-size:11px;padding:7px 0}.day{min-height:82px;border:1px solid #f0f0ec;border-radius:12px;padding:7px 6px;background:#fff}.day.other{background:#fafaf8;color:#aeb4b1}.day.today{border:1.5px solid #729882;background:#f4faf5}.day-num{font-size:12px;font-weight:700}.day-items{display:grid;gap:3px;margin-top:5px}.day-item{font-size:10px;line-height:1.2;background:#eaf0f7;color:#426287;border-radius:5px;padding:3px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.day-item.done{background:#eaf3ed;color:#58806a;text-decoration:line-through}.day-item.late{background:#faeeee;color:#a95252}.list-tools{display:flex;gap:8px;align-items:center}.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;color:#59636d}.reminder-list{display:grid;gap:11px}.reminder-card{border:1px solid var(--line);border-radius:16px;padding:15px;display:grid;grid-template-columns:28px 1fr auto;gap:11px;align-items:start}.reminder-card .task-actions{grid-column:2/4;display:flex;justify-content:flex-end;gap:8px}.text-btn{border:0;background:transparent;color:#66717c;font-size:12px;padding:5px 8px}.text-btn:hover{color:var(--blue)}.week-list{display:grid;gap:9px}.week-day{display:grid;grid-template-columns:80px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0ec}.week-day:last-child{border:0}.week-date{font-size:12px;color:var(--muted);padding-top:8px}.week-block{min-height:38px;border-left:3px solid #8ba5c1;background:#f4f7fa;border-radius:4px 10px 10px 4px;padding:8px 10px;font-size:13px}.week-block.done{border-color:#71a181;background:#f1f7f2}.week-block .muted{font-size:11px;margin-left:6px}.modal-backdrop{position:fixed;inset:0;background:#1f2b3780;display:grid;place-items:center;padding:18px;z-index:5}.modal{width:min(500px,100%);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 18px;font-size:21px}.category-modal{max-height:90vh;overflow:auto}.category-list{display:grid;gap:8px;margin:16px 0}.category-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center}.category-row input,.category-add input{min-width:0;padding:9px 10px;border:1px solid #dfe3df;border-radius:9px}.category-row .text-btn{white-space:nowrap}.category-row button:disabled{opacity:.45;cursor:not-allowed}.category-add{display:grid;gap:7px;border-top:1px solid var(--line);padding-top:14px}.category-add label{font-size:13px;font-weight:700}.category-add>div{display:flex;gap:8px}.category-add input{flex:1}.category-manage{justify-self:start;margin-top:2px}.field input[type="date"]{display:block;width:100%;min-height:44px;padding:11px 12px;border:1px solid #dfe3df;border-radius:10px;background:#fff;color:var(--ink);font:inherit;line-height:1.25;text-align:left;color-scheme:light;-webkit-appearance:none;appearance:none}.field input[type="date"]::-webkit-date-and-time-value{text-align:left;min-height:1.25em}.field input[type="date"]::-webkit-calendar-picker-indicator{opacity:.75}.site-info{max-width:560px}.site-info h2{margin:5px 0 8px;font-size:22px}.site-info p{margin:0;color:var(--muted)}.site-version{margin-top:20px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.site-version strong{color:var(--blue);font-size:18px}.daily-card .task-row{grid-template-columns:38px 1fr auto;padding:16px 12px;gap:12px}.daily-card .check{width:32px;height:32px;border-radius:10px}.daily-card .task-title{font-size:16px}.daily-card .task-meta{font-size:13px}.inline-expand{width:100%;min-height:48px;margin-top:12px;border:1px solid #dce5dd;border-radius:12px;background:#f6faf6;color:#315c49;font-weight:750;font-size:15px}.inline-expand:hover{background:#e9f0e9}.weekly-card .inline-expand{margin-top:16px}.form{display:grid;gap:14px}.field label{display:block;font-size:12px;font-weight:700;color:#59636d;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #dfe3df;border-radius:10px;background:white;color:var(--ink)}.field textarea{resize:vertical;min-height:82px}.storage-alert{padding:12px 14px;margin:-8px 0 18px;border:1px solid #ead8b5;border-radius:12px;background:#fff8e9;color:#765523;font-size:13px;line-height:1.6}.form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.danger{color:var(--red)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:800px){.app{display:block}aside{position:fixed;z-index:3;bottom:0;left:0;right:0;padding:7px 10px max(8px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);display:block;background:#f5f5efee;backdrop-filter:blur(12px)}.brand,.aside-note{display:none}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}.nav button{justify-content:center;flex-direction:column;gap:3px;padding:7px 2px;font-size:10px}.nav button.nav-add{margin:0 2px;border-radius:12px;background:#315c49;color:#fff}.nav button.nav-add .ico{color:#fff}.nav .ico{font-size:17px}.layout{grid-template-columns:1fr}.topline{margin-bottom:18px}.topline h1{font-size:25px}main{padding:24px 16px 100px}.card{padding:17px;border-radius:17px}.day{min-height:64px;padding:5px 4px}.day-item{font-size:9px}.mini-stats{gap:7px}.stat{padding:12px 10px}.stat strong{font-size:17px}.due{font-size:11px}}
    @media(max-width:390px){.task-row{grid-template-columns:27px 1fr}.task-row>.due{grid-column:2}.topline .primary.add-task-button{min-height:48px;padding:11px 14px;font-size:14px}.day{min-height:56px}.day-item{max-width:100%}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const STORE='yorimichi.tasks.v1';
    const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
    const seed=[
      {id:'demo-1',title:'提出レポートの見直し',due:offsetISO(1),category:'学校',done:false,demo:true},
      {id:'demo-2',title:'シフト希望を送る',due:offsetISO(3),category:'仕事',done:false,demo:true},
      {id:'demo-3',title:'書類をファイルに入れる',due:offsetISO(-1),category:'生活',done:true,demo:true},
    ];
    function offsetISO(n){const d=new Date();d.setDate(d.getDate()+n);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function dateObj(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
    function formatDate(s,opts={month:'numeric',day:'numeric'}){if(!s)return '日付なし';return dateObj(s).toLocaleDateString('ja-JP',opts)}
    function startWeek(date){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setDate(d.getDate()-((d.getDay()+6)%7));return d}
    function periodTasks(tasks,period){const now=dateObj(todayISO());let start,end;if(period==='day'){start=new Date(now);end=new Date(now)}else if(period==='week'){start=startWeek(now);end=new Date(start);end.setDate(end.getDate()+6)}else{start=new Date(now.getFullYear(),now.getMonth(),1);end=new Date(now.getFullYear(),now.getMonth()+1,0)}return tasks.filter(t=>{if(!t.due)return false;const d=dateObj(t.due);return d>=start&&d<=end})}
    function pct(tasks){return tasks.length?Math.round(tasks.filter(t=>t.done).length/tasks.length*100):null}
    function daysLeft(s){return Math.round((dateObj(s)-dateObj(todayISO()))/86400000)}
    function dueText(s,done){if(done)return '完了';const n=daysLeft(s);if(n<0)return `期限超過 ${Math.abs(n)}日`;if(n===0)return '今日が締切';if(n===1)return 'あと1日';return `あと${n}日`}
    const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let storageMessage='';
    function loadTasks(){try{const raw=localStorage.getItem(STORE);if(!raw)return seed;const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw new Error('invalid task data');return parsed}catch{storageMessage='保存データを読み込めませんでした。このブラウザーでファイルの保存が制限されている可能性があります。';return seed}}
    const initialTasks=loadTasks();
    const CATEGORY_STORE='yorimichi.categories.v1';
    const DEFAULT_CATEGORIES=['生活','学校','仕事','健康','その他'];
    function loadCategories(tasks){try{const saved=JSON.parse(localStorage.getItem(CATEGORY_STORE)||'null');const list=Array.isArray(saved)?saved.filter(x=>typeof x==='string'&&x.trim()):[...DEFAULT_CATEGORIES];for(const t of tasks)if(t.category&&!list.includes(t.category))list.push(t.category);if(!list.includes('その他'))list.push('その他');return [...new Set(list)]}catch{return [...DEFAULT_CATEGORIES]}}
    const state={tasks:initialTasks,categories:loadCategories(initialTasks),tab:'home',range:'month',month:new Date(),day:todayISO(),filter:'all',editing:null,showForm:false,showCategoryManager:false,showAllDaily:false,showWeeklyTasks:false,taskDraft:null,categoryMessage:'',flash:''};
    const root=document.getElementById('root');
    function save(){try{localStorage.setItem(STORE,JSON.stringify(state.tasks));storageMessage='';return true}catch{storageMessage='ブラウザーに保存できませんでした。追加した内容はこのページを閉じると消える可能性があります。ChromeまたはEdgeで開き直してください。';return false}}
    function saveCategories(){try{localStorage.setItem(CATEGORY_STORE,JSON.stringify(state.categories));return true}catch{storageMessage='カテゴリーを保存できませんでした。ブラウザーの保存設定を確認してください。';return false}}
    function categoryManager(){return `<div class="modal-backdrop" data-action="backdrop"><section class="modal category-modal" role="dialog" aria-modal="true" aria-labelledby="category-title"><h2 id="category-title">カテゴリー管理</h2><p class="muted small">名前を変えると、登録済みタスクにも反映されます。削除したカテゴリーのタスクは「その他」へ移動します。</p>${state.categoryMessage?`<div class="storage-alert" role="status">${esc(state.categoryMessage)}</div>`:''}<div class="category-list">${state.categories.map((c,i)=>`<div class="category-row"><input id="category-name-${i}" value="${esc(c)}" maxlength="24" aria-label="${esc(c)}のカテゴリー名"><button type="button" class="text-btn" data-action="rename-category" data-index="${i}">名前を変更</button><button type="button" class="text-btn danger" data-action="delete-category" data-index="${i}" ${c==='その他'?'disabled title="その他は削除できません"':''}>削除</button></div>`).join('')}</div><div class="category-add"><label for="new-category">新しいカテゴリー</label><div><input id="new-category" maxlength="24" placeholder="例：趣味"><button type="button" class="primary" data-action="add-category">＋ 追加</button></div></div><div class="form-actions"><button type="button" class="text-btn" data-action="close-category-manager">タスク入力に戻る</button></div></section></div>`}
    function sorted(){return [...state.tasks].sort((a,b)=>a.due.localeCompare(b.due))}
    function progress(tasks,label){const p=pct(tasks);return `<div class="progress-wrap"><div class="progress-copy"><span class="muted small">${label}の達成率</span><strong ${p===null?'style="font-size:14px;color:#77808c"':''}>${p===null?'対象タスクなし':p+'%'}</strong></div>${p===null?'':`<div class="progress" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100" aria-label="${label}の達成率 ${p}%"><span style="width:${p}%"></span></div><div class="progress-note">${tasks.filter(t=>t.done).length}件完了 ／ ${tasks.length}件</div>`}</div>`}
    function dueClass(t){return !t.done&&daysLeft(t.due)<=0?'late':!t.done&&daysLeft(t.due)===1?'soon':''}
    function taskRows(tasks,empty){if(!tasks.length)return `<div class="empty">${empty}</div>`;return `<div class="task-list">${tasks.map(t=>`<div class="task-row"><button class="check ${t.done?'done':''}" data-action="toggle" data-id="${esc(t.id)}" aria-label="${t.done?'未完了にする':'完了にする'}">${t.done?'✓':''}</button><div><div class="task-title ${t.done?'done':''} ${dueClass(t)==='late'?'late':''}">${esc(t.title)}</div><div class="task-meta">${esc(t.category)} · ${formatDate(t.due)}締切</div>${t.memo?`<div class="task-note">${esc(t.memo)}</div>`:''}</div><div class="due ${dueClass(t)}">${dueText(t.due,t.done)}</div></div>`).join('')}</div>`}
    function reminders(tasks){if(!tasks.length)return '<div class="empty">表示するタスクがありません。<br/>「タスクを追加」から登録できます。</div>';return `<div class="reminder-list">${tasks.map(t=>`<div class="reminder-card"><button class="check ${t.done?'done':''}" data-action="toggle" data-id="${esc(t.id)}" aria-label="${t.done?'未完了にする':'完了にする'}">${t.done?'✓':''}</button><div><div class="task-title ${t.done?'done':''} ${dueClass(t)==='late'?'late':''}">${esc(t.title)}</div><div class="task-meta">${esc(t.category)} · 締切 ${formatDate(t.due,{year:'numeric',month:'long',day:'numeric'})}</div>${t.memo?`<div class="task-note">${esc(t.memo)}</div>`:''}</div><span class="pill ${dueClass(t)==='late'?'danger':''}">${dueText(t.due,t.done)}</span><div class="task-actions"><button class="text-btn" data-action="edit" data-id="${esc(t.id)}">編集</button><button class="text-btn danger" data-action="delete" data-id="${esc(t.id)}">削除</button></div></div>`).join('')}</div>`}
    function monthCalendar(){const m=state.month;const start=startWeek(new Date(m.getFullYear(),m.getMonth(),1));let cells='';for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const items=state.tasks.filter(t=>t.due===iso);cells+=`<div class="day ${d.getMonth()!==m.getMonth()?'other':''} ${iso===todayISO()?'today':''}"><div class="day-num">${d.getDate()}</div><div class="day-items">${items.slice(0,2).map(t=>`<button class="day-item ${t.done?'done':''} ${dueClass(t)==='late'?'late':''}" data-action="edit" data-id="${esc(t.id)}" title="${esc(t.title)}">${esc(t.title)}</button>`).join('')}${items.length>2?`<span class="muted" style="font-size:9px">ほか${items.length-2}件</span>`:''}</div></div>`}return `<div class="calendar">${['月','火','水','木','金','土','日'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells}</div>`}
    function weekCalendar(){const today=dateObj(todayISO());const base=startWeek(state.month.getMonth()===today.getMonth()?today:new Date(state.month.getFullYear(),state.month.getMonth(),1));return `<div class="week-list">${Array.from({length:7},(_,i)=>{const d=new Date(base);d.setDate(base.getDate()+i);const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const matches=state.tasks.filter(t=>t.due===iso);return `<div class="week-day"><div class="week-date">${formatDate(iso,{month:'numeric',day:'numeric',weekday:'short'})}</div><div>${matches.length?matches.map(t=>`<div class="week-block ${t.done?'done':''}">${esc(t.title)}<span class="muted">${t.done?'完了':'締切'}</span></div>`).join(''):'<div class="muted small" style="padding:10px">タスクなし</div>'}</div></div>`}).join('')}</div>`}
    function dayCalendar(){const matches=state.tasks.filter(t=>t.due===state.day);return `<div><div class="month-nav" style="justify-content:center;margin-bottom:14px"><button data-action="day-prev" aria-label="前の日">‹</button><strong>${formatDate(state.day,{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</strong><button data-action="day-next" aria-label="次の日">›</button></div>${taskRows(matches,'この日に締切のタスクはありません。')}</div>`}
    function saveTask(event){event?.preventDefault();const f=root.querySelector('#task-form');if(!f)return;if(!f.checkValidity()){f.reportValidity();return}const data=new FormData(f),title=String(data.get('title')||'').trim();if(!title){f.elements.title.focus();return}const wasEditing=Boolean(state.editing);const item={id:state.editing?.id||`task-${Date.now()}-${Math.random().toString(16).slice(2)}`,title,due:data.get('due'),memo:String(data.get('memo')||'').trim(),category:data.get('category'),done:state.editing?.done||false};if(wasEditing)state.tasks=state.tasks.map(t=>t.id===item.id?item:t);else state.tasks.push(item);state.showForm=false;state.showCategoryManager=false;state.taskDraft=null;state.editing=null;state.tab='home';state.flash=wasEditing?'クエストを更新しました。':'クエストを追加しました。';save();render()}
    function form(){const t=state.editing,d=state.taskDraft||{};return `<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="form-title"><h2 id="form-title">${t?'タスクを編集':'タスクを追加'}</h2><form class="form" id="task-form"><div class="field"><label for="task-title">タスク名</label><input autofocus id="task-title" name="title" value="${esc(d.title??t?.title??'')}" placeholder="例：レポートを提出する" required maxlength="80"></div><div class="field"><label for="task-date">期限</label><input id="task-date" name="due" type="date" value="${esc(d.due??t?.due??todayISO())}" required></div><div class="field"><label for="task-memo">詳細・メモ（任意）</label><textarea id="task-memo" name="memo" rows="3" maxlength="500" placeholder="必要な持ち物や、次にすることなど">${esc(d.memo??t?.memo??'')}</textarea></div><div class="field"><label for="task-category">カテゴリー</label><select id="task-category" name="category">${state.categories.map(c=>`<option ${(d.category??t?.category??'生活')===c?'selected':''}>${esc(c)}</option>`).join('')}</select><button type="button" class="text-btn category-manage" data-action="manage-categories">カテゴリーを管理</button></div><div class="form-actions"><button type="button" class="text-btn" data-action="close-form">キャンセル</button><button class="primary" type="button" data-action="save-task">保存する</button></div></form></section></div>`}
    function dailyQuest(tasks){const shown=state.showAllDaily?tasks:tasks.slice(0,3);return `<section class="card daily-card"><div class="card-head"><h2>デイリークエスト</h2><span class="pill">${tasks.length}件</span></div>${taskRows(shown,'今日が締切の未完了タスクはありません。')}${tasks.length>3?`<button class="inline-expand" data-action="toggle-daily">${state.showAllDaily?'閉じる':'すべて見る'}</button>`:''}</section>`}
    function weeklyQuest(tasks){return `<section class="card weekly-card"><div class="card-head"><h2>ウィークリークエスト</h2><span class="muted small">今週</span></div><button class="inline-expand" data-action="toggle-weekly">${state.showWeeklyTasks?'閉じる':'すべて見る'}</button>${state.showWeeklyTasks?taskRows(tasks,'今週が締切のタスクはありません。'):''}</section>`}
    function siteInfo(){return `<section class="card site-info"><div class="eyebrow">TASQUEST</div><h2>タスククエスト</h2><p>スマートフォン向けタスク管理Webサイト</p><div class="site-version">バージョン <strong>ver.1.0.0</strong></div></section>`}
    function render(){
      const ordered=sorted(),todayTasks=ordered.filter(t=>t.due===todayISO()&&!t.done);
      const titles={home:['タスククエスト',''],calendar:['カレンダー','締切がある日をひと目で確認できます。'],reminders:['リマインダー','締切順に並んでいます。完了したらチェック。'],about:['サイト情報','タスクエストについて']};const label=titles[state.tab]||['タスクを追加','思いついたことを忘れないうちに。'];
      let content='';
      if(state.tab==='home'){const weekly=periodTasks(state.tasks,'week');content=`<div class="layout"><div class="stack">${dailyQuest(todayTasks)}${weeklyQuest(weekly)}</div><div class="stack"><section class="card"><div class="card-head"><h2>達成率</h2><span class="muted small">締切日で集計</span></div><div class="stack">${progress(periodTasks(state.tasks,'day'),'今日')}${progress(weekly,'今週')}${progress(periodTasks(state.tasks,'month'),'今月')}</div></section></div></div>`}
      if(state.tab==='calendar'){content=`<section class="card"><div class="card-head"><div class="month-nav"><button data-action="month-prev" aria-label="前の月">‹</button><strong>${state.month.getFullYear()}年${state.month.getMonth()+1}月</strong><button data-action="month-next" aria-label="次の月">›</button></div><div class="view-toggle">${[['month','月'],['week','週'],['day','日']].map(([v,l])=>`<button data-action="range" data-range="${v}" class="${state.range===v?'active':''}">${l}</button>`).join('')}</div></div>${state.range==='month'?monthCalendar():state.range==='week'?weekCalendar():dayCalendar()}<div class="muted small" style="margin-top:14px">締切のあるタスクが表示されます。予定の登録は次の段階で追加できます。</div></section>`}
      if(state.tab==='reminders'){const filtered=ordered.filter(t=>state.filter==='all'?true:state.filter==='open'?!t.done:state.filter==='done'?t.done:!t.done&&daysLeft(t.due)<0);content=`<section class="card"><div class="card-head"><h2>タスク一覧</h2><div class="list-tools"><select class="select" id="filter" aria-label="表示するタスク"><option value="all" ${state.filter==='all'?'selected':''}>すべて</option><option value="open" ${state.filter==='open'?'selected':''}>未完了</option><option value="done" ${state.filter==='done'?'selected':''}>完了</option><option value="late" ${state.filter==='late'?'selected':''}>期限超過</option></select></div></div>${reminders(filtered)}</section>`}
      if(state.tab==='about')content=siteInfo();
      root.innerHTML=`<div class="app"><aside><div class="brand"><div class="brand-mark">◒</div><div><strong>タスククエスト</strong><small>TASQUEST</small></div></div><nav class="nav" aria-label="メインメニュー"><button data-action="tab" data-tab="home" class="${state.tab==='home'?'active':''}"><span class="ico">⌂</span>ホーム</button><button data-action="tab" data-tab="calendar" class="${state.tab==='calendar'?'active':''}"><span class="ico">▦</span>カレンダー</button><button data-action="tab" data-tab="reminders" class="${state.tab==='reminders'?'active':''}"><span class="ico">☑</span>タスク一覧</button><button data-action="tab" data-tab="about" class="${state.tab==='about'?'active':''}"><span class="ico">ℹ</span>サイト情報</button></nav><div class="aside-note"><strong>小さく始めてOK</strong>予定が多い日も、ひとつできたら前進です。</div></aside><main><div class="topline"><div><div class="date-label">${new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}</div><h1>${label[0]}</h1><div class="muted small">${label[1]}</div></div><button class="primary" data-action="new">＋ タスクを追加</button></div>${storageMessage?`<div class="storage-alert" role="alert">⚠ ${esc(storageMessage)}</div>`:''}${state.flash?`<div class="success-alert" role="status">✓ ${esc(state.flash)}</div>`:''}${content}${state.showForm?(state.showCategoryManager?categoryManager():form()):''}<div class="muted small" style="text-align:center;margin-top:22px">データはこのブラウザー内に保存されます。別の端末とは同期されません。最初の3件はサンプルです。</div></main></div>`;
    }
    root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(!['manage-categories','close-category-manager','add-category','rename-category','delete-category'].includes(a))return;e.stopImmediatePropagation();if(a==='manage-categories'){const f=root.querySelector('#task-form');if(f){const d=new FormData(f);state.taskDraft={title:d.get('title')||'',due:d.get('due')||'',memo:d.get('memo')||'',category:d.get('category')||''}}state.categoryMessage='';state.showCategoryManager=true;render();return}if(a==='close-category-manager'){state.showCategoryManager=false;state.categoryMessage='';render();return}if(a==='add-category'){const input=root.querySelector('#new-category'),name=String(input?.value||'').trim();if(!name)state.categoryMessage='カテゴリー名を入力してください。';else if(state.categories.includes(name))state.categoryMessage='同じ名前のカテゴリーがあります。';else{state.categories.push(name);saveCategories();state.categoryMessage='カテゴリーを追加しました。'}render();return}const i=Number(b.dataset.index),old=state.categories[i];if(a==='rename-category'){const input=root.querySelector('#category-name-'+i),name=String(input?.value||'').trim();if(!name)state.categoryMessage='カテゴリー名を入力してください。';else if(state.categories.some((c,j)=>j!==i&&c===name))state.categoryMessage='同じ名前のカテゴリーがあります。';else{state.categories[i]=name;state.tasks=state.tasks.map(t=>t.category===old?{...t,category:name}:t);if(state.taskDraft?.category===old)state.taskDraft.category=name;saveCategories();save();state.categoryMessage='カテゴリー名を変更しました。'}render();return}if(old&&old!=='その他'&&state.categories.length>1){state.categories=state.categories.filter((_,j)=>j!==i);state.tasks=state.tasks.map(t=>t.category===old?{...t,category:'その他'}:t);if(state.taskDraft?.category===old)state.taskDraft.category='その他';saveCategories();save();state.categoryMessage='削除したカテゴリーのタスクを「その他」へ移しました。'}render()});
    root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='backdrop'&&e.target!==b)return;if(a==='save-task'){saveTask();return}if(a!=='tab')state.flash='';if(a==='tab')state.tab=b.dataset.tab;if(a==='new'){state.editing=null;state.taskDraft=null;state.showCategoryManager=false;state.showForm=true}if(a==='close-form'||(a==='backdrop'&&e.target===b)){state.showForm=false;state.showCategoryManager=false;state.taskDraft=null};if(a==='toggle-daily'){state.showAllDaily=!state.showAllDaily;render();return}if(a==='toggle-weekly'){state.showWeeklyTasks=!state.showWeeklyTasks;render();return}if(a==='toggle'){state.tasks=state.tasks.map(t=>t.id===id?{...t,done:!t.done}:t);save()}if(a==='edit'){state.editing=state.tasks.find(t=>t.id===id);state.taskDraft=null;state.showCategoryManager=false;state.showForm=true}if(a==='delete'){if(confirm('このタスクを削除しますか？')){state.tasks=state.tasks.filter(t=>t.id!==id);save()}}if(a==='range')state.range=b.dataset.range;if(a==='month-prev')state.month=new Date(state.month.getFullYear(),state.month.getMonth()-1,1);if(a==='month-next')state.month=new Date(state.month.getFullYear(),state.month.getMonth()+1,1);if(a==='day-prev'){const d=dateObj(state.day);d.setDate(d.getDate()-1);state.day=toISO(d)}if(a==='day-next'){const d=dateObj(state.day);d.setDate(d.getDate()+1);state.day=toISO(d)}render()});
    root.addEventListener('change',e=>{if(e.target.id==='filter'){state.filter=e.target.value;render()}});
    root.addEventListener('submit',e=>{if(e.target.id==='task-form')saveTask(e)});
    function toISO(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    render();
  </script>
</body>
</html>
